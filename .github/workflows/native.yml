# CI for the C++20/MLX tree under native/ (Issue #5, T0.2).
#
# Runs the CPU-only categories (unit, component, integration) through the `ci`
# CMake preset; GPU variants (*/gpu), acceptance and performance tests are
# excluded by that preset. MLX is built from its pinned release tag and cached,
# because Homebrew's formula lags upstream and the floor is MLX 0.32.5 (D2).
name: native

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single place to bump MLX. Keep in step with SPECTRE_MINIMUM_MLX_VERSION in native/CMakeLists.txt.
  MLX_VERSION: 0.32.5

jobs:
  cpu-tests:
    runs-on: macos-15 # Apple silicon (arm64)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: lukka/get-cmake@v4.5.1 # CMake >= 3.27 and Ninja

      - name: Restore MLX install
        id: mlx-cache
        uses: actions/cache@v6
        with:
          path: ~/mlx-install
          # The workflow hash is in the key so changing the MLX build flags below rebuilds it.
          key: mlx-${{ env.MLX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/native.yml') }}

      - name: Fetch MLX source
        if: steps.mlx-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ml-explore/mlx
          ref: v${{ env.MLX_VERSION }}
          path: mlx-src

      - name: Build and install MLX
        if: steps.mlx-cache.outputs.cache-hit != 'true'
        run: |
          # Recent Xcode versions ship the Metal compiler as a separate component.
          xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          cmake -S mlx-src -B mlx-src/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$HOME/mlx-install" \
                -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DMLX_BUILD_BENCHMARKS=OFF \
                -DMLX_BUILD_PYTHON_BINDINGS=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build mlx-src/build --target install

      - name: Configure
        working-directory: native
        run: cmake --preset ci -DCMAKE_PREFIX_PATH="$HOME/mlx-install"

      - name: Build
        working-directory: native
        run: cmake --build --preset ci

      - name: Test (CPU only)
        working-directory: native
        run: ctest --preset ci
